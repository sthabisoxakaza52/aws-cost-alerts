name: Deploy Dashboard

on:
  push:
    branches: [ "main" ]
    paths:
      - "cost_alerts/dashboard.html"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          pytest -v

      - name: Deploy Dashboard to S3
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          if [ -z "$AWS_KEY" ] || [ -z "$AWS_SECRET" ] || [ -z "$S3_BUCKET" ]; then
            echo "::notice title=S3 Deployment Skipped::AWS secrets (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_BUCKET) are not configured in GitHub repository secrets. Deployment step skipped safely."
            exit 0
          fi

          echo "Configuring AWS credentials..."
          export AWS_ACCESS_KEY_ID="$AWS_KEY"
          export AWS_SECRET_ACCESS_KEY="$AWS_SECRET"
          export AWS_DEFAULT_REGION="$AWS_REGION"

          echo "Uploading dashboard.html to s3://$S3_BUCKET/index.html..."
          aws s3 cp cost_alerts/dashboard.html "s3://$S3_BUCKET/index.html" --content-type "text/html"
          echo "Dashboard successfully deployed to s3://$S3_BUCKET/index.html"
