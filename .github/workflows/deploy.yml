name: Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          pytest -v

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp cost_alerts/dashboard.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy Dashboard to S3 (if AWS configured)
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          if [ -z "$AWS_KEY" ] || [ -z "$AWS_SECRET" ] || [ -z "$S3_BUCKET" ]; then
            echo "::notice title=S3 Mirror Skipped::AWS secrets are not configured in GitHub repository secrets. GitHub Pages deployment succeeded."
            exit 0
          fi

          echo "Configuring AWS credentials..."
          export AWS_ACCESS_KEY_ID="$AWS_KEY"
          export AWS_SECRET_ACCESS_KEY="$AWS_SECRET"
          export AWS_DEFAULT_REGION="$AWS_REGION"

          echo "Uploading dashboard to s3://$S3_BUCKET/index.html..."
          aws s3 cp cost_alerts/dashboard.html "s3://$S3_BUCKET/index.html" --content-type "text/html"
          echo "Dashboard successfully mirrored to s3://$S3_BUCKET/index.html"
