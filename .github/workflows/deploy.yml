name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify test suite
        run: pytest -v

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp cost_alerts/dashboard.html _site/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site

      - name: Deploy to Amazon S3 (if configured)
        if: ${{ env.AWS_KEY != '' && env.AWS_SECRET != '' && env.S3_BUCKET != '' }}
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
        run: |
          export AWS_ACCESS_KEY_ID="$AWS_KEY"
          export AWS_SECRET_ACCESS_KEY="$AWS_SECRET"
          export AWS_DEFAULT_REGION="$AWS_REGION"
          aws s3 cp cost_alerts/dashboard.html "s3://$S3_BUCKET/index.html" --content-type "text/html"
          echo "Successfully mirrored dashboard to s3://$S3_BUCKET/index.html"

      - name: Deployment status notice
        if: ${{ env.AWS_KEY == '' || env.AWS_SECRET == '' || env.S3_BUCKET == '' }}
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          echo "::notice title=Deployment Validation Passed::Project verified and GitHub Pages deployed. To mirror to S3 on push, add AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and S3_BUCKET to GitHub repository secrets."
